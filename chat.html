<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Vlastimir's page!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('images/soda.gif');
            background-size: 150px auto;
            background-repeat: repeat;
            background-color: #f0f0f0;
            font-family: 'Comic Sans MS', sans-serif;
        }
        .simple-box {
            width: 80%;
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 1px;
            padding: 30px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        /* Стили для окна чата */
        .chat-window {
            border: 2px solid #ccc;
            border-radius: 10px;
            padding: 15px;
            background: #f9f9f9;
            margin: 20px 0;
            max-height: 400px;
            display: flex;
            flex-direction: column;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            max-height: 250px;
            margin-bottom: 10px;
            padding: 5px;
            background: white;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        .chat-message {
            border-bottom: 1px solid #eee;
            padding: 5px 0;
        }
        .chat-message .name {
            font-weight: bold;
            color: #2a7ae2;
        }
        .chat-message .time {
            color: #888;
            font-size: 0.8em;
            margin-left: 10px;
        }
        .chat-input-area {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .chat-input-area input[type="text"] {
            flex: 1;
            min-width: 100px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .chat-input-area button {
            padding: 8px 20px;
            background: #2a7ae2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .chat-input-area button:hover {
            background: #1a5bbf;
        }
        .chat-status {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="simple-box">
    <center><img src="images/Page.png" alt="PAGE"></center>
    <p><center><h1 style="font-family: 'Comic Sans MS'"> <img src="images/7-up.gif" alt="Com">Другое...<img src="images/7-up.gif" alt="Com"></h1></center></p>
    <center><img width="800" src="images/const.gif" alt="Construction"></center>
    <center><h4 style="font-family: 'Comic Sans MS'">
        <a href="mainpage.html">Главная</a>
        <a href="comments.html">Гостевая книга</a>
        <a href="files.html">Файлы</a>
        <a href="videos.html">Видео</a>
        <a href="pictures.html">Изображения</a>
        <a href="programs.html">Приложения</a>
        <a href="news.html">Новости</a>
        <a href="games.html">Игры</a>
        <a href="audio.html">Аудио</a>
        <a href="other.html">Другое...</a>
    </h4></center>
    <center><img width="800" src="images/const.gif" alt="Construction"></center>
    
    <!-- ========== БЛОК ЧАТА ========== -->
    <div class="chat-window">
        <h3 style="margin-top:0;">💬 Чат</h3>
        <div class="chat-messages" id="chatMessages">
            <!-- Сообщения будут подгружаться сюда -->
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatName" placeholder="Ваше имя" value="Гость">
            <input type="text" id="chatMessage" placeholder="Введите сообщение..." style="flex:2;">
            <button id="sendBtn">Отправить</button>
        </div>
        <div class="chat-status" id="chatStatus">Загрузка...</div>
    </div>
    <!-- ================================= -->
    <left><h2><script type="text/javascript" src="https://www.usersonline.org/uo-4x7ZZ3zw3Bdw1wZD-3-0.js"></script><br><a href="https://www.usersonline.org/" target="_blank"><img src="https://www.usersonline.org/selo/selo-uo.gif" alt="users online free counter" border="0"></a></h2></left>
    <center><h1 style="font-family: 'Comic Sans MS'">Чат с Властимиром! Общяйтесь и задавайте вопросы!</h1></center>
    <br><br>
    <center><h2 style="font-family: 'Comic Sans MS'"><a href="admin">Админ панель</a></h2></center>
</div>

<script>
    const messagesDiv = document.getElementById('chatMessages');
    const nameInput = document.getElementById('chatName');
    const messageInput = document.getElementById('chatMessage');
    const sendBtn = document.getElementById('sendBtn');
    const statusDiv = document.getElementById('chatStatus');

    // Загрузка сообщений с сервера
    async function loadMessages() {
        try {
            const response = await fetch('/get_messages');
            const messages = await response.json();
            messagesDiv.innerHTML = messages.map(msg => `
                <div class="chat-message">
                    <span class="name">${escapeHtml(msg.name)}</span>
                    <span class="time">${msg.timestamp}</span>
                    <span>${escapeHtml(msg.message)}</span>
                </div>
            `).join('');
            // Прокрутка вниз
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            statusDiv.textContent = 'Обновлено';
        } catch (e) {
            statusDiv.textContent = 'Ошибка загрузки';
            console.error(e);
        }
    }

    // Отправка сообщения
    async function sendMessage() {
        const name = nameInput.value.trim() || 'Аноним';
        const message = messageInput.value.trim();
        if (!message) {
            alert('Введите сообщение');
            return;
        }

        const formData = new FormData();
        formData.append('name', name);
        formData.append('message', message);

        try {
            const response = await fetch('/send_message', {
                method: 'POST',
                body: formData
            });
            const result = await response.json();
            if (result.status === 'ok') {
                messageInput.value = '';
                loadMessages(); // сразу обновить
            } else {
                alert('Ошибка: ' + (result.message || 'неизвестная'));
            }
        } catch (e) {
            alert('Ошибка отправки');
            console.error(e);
        }
    }

    // Простая защита от XSS
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Отправка по Enter
    messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
    sendBtn.addEventListener('click', sendMessage);

    // Загружаем сообщения сразу и обновляем каждые 3 секунды
    loadMessages();
    setInterval(loadMessages, 3000);
</script>

</body>
</html>
